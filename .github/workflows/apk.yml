name: APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: nomal für Android
    runs-on: ubuntu-22.04
    steps:
      - name: Projekt holen
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # SDK und NDK sind rund 2 GB. Ohne Cache lädt jeder Lauf sie neu.
      # Muss VOR dem Bauen stehen, sonst wird der Cache nur geschrieben
      # und nie zurückgespielt.
      - name: SDK und NDK aus dem Cache
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: System-Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 python3-dev python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            zip unzip libltdl-dev

      - name: Cython und Buildozer installieren
        run: |
          pip3 install --user --upgrade setuptools wheel
          pip3 install --user --upgrade "cython<3"
          pip3 install --user --upgrade buildozer

      - name: Pfad für Buildozer exportieren
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Erster Durchgang: holt SDK und NDK. Die Lizenzfrage beantwortet
      # jetzt buildozer.spec (android.accept_sdk_license = True).
      # Bricht dieser Durchgang ab, geht es trotzdem weiter - der
      # nächste Schritt räumt die bekannte Stolperstelle weg, und der
      # Durchgang danach meldet jeden echten Fehler.
      - name: SDK holen
        run: |
          unset ANDROID_SDK_ROOT ANDROID_NDK_ROOT ANDROID_HOME
          buildozer -v android debug || echo "erster Durchgang abgebrochen, weiter"

      # Buildozer nimmt immer die neuesten Build-Tools und verlangt
      # darin das Werkzeug aidl. Google liefert aidl in den neuen
      # Fassungen nicht mehr mit. Falls es fehlt, holen wir die alte
      # 33.0.2 und legen ihr aidl daneben.
      - name: aidl nachreichen, falls es fehlt
        run: |
          SDK=$HOME/.buildozer/android/platform/android-sdk
          test -d "$SDK/build-tools" || exit 0
          NEU=$(ls "$SDK/build-tools" | sort -V | tail -1)
          if [ -x "$SDK/build-tools/$NEU/aidl" ]; then
            echo "aidl ist in $NEU vorhanden, nichts zu tun"
            exit 0
          fi
          echo "aidl fehlt in $NEU - hole es aus 33.0.2"
          yes | "$SDK/tools/bin/sdkmanager" --sdk_root="$SDK" "build-tools;33.0.2"
          cp "$SDK/build-tools/33.0.2/aidl" "$SDK/build-tools/$NEU/aidl"
          chmod +x "$SDK/build-tools/$NEU/aidl"

      - name: Spiel mit Buildozer kompilieren
        run: |
          unset ANDROID_SDK_ROOT ANDROID_NDK_ROOT ANDROID_HOME
          buildozer -v android debug

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: nomal-apk
          path: bin/*.apk

      - name: Protokoll bei Fehlschlag ausgeben
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bau-protokoll
          path: |
            .buildozer/android/platform/build-*/build.log
            .buildozer/**/*.log
          if-no-files-found: ignore
