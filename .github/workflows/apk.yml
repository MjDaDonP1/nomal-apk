name: APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: nomal für Android
    runs-on: ubuntu-22.04
    steps:
      - name: Projekt holen
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # SDK und NDK sind rund 2 GB. Ohne Cache lädt jeder Lauf sie neu.
      # Der Schritt muss VOR dem Bauen stehen, sonst wird der Cache nur
      # geschrieben und nie zurückgespielt.
      - name: SDK und NDK aus dem Cache
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: System-Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 python3-dev python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            zip unzip libltdl-dev

      - name: Cython und Buildozer installieren
        run: |
          pip3 install --user --upgrade setuptools wheel
          pip3 install --user --upgrade "cython<3"
          pip3 install --user --upgrade buildozer

      - name: Pfad für Buildozer exportieren
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Die Lizenzen nimmt jetzt buildozer.spec an
      # (android.accept_sdk_license = True). Die vorinstallierten
      # SDK-Pfade des Runners werden geleert, damit Buildozer sein
      # eigenes SDK benutzt - unset statt Leerstring, sonst sieht
      # manches Werkzeug einen leeren Pfad statt gar keinen.
      - name: Spiel mit Buildozer kompilieren
        run: |
          unset ANDROID_SDK_ROOT ANDROID_NDK_ROOT ANDROID_HOME
          buildozer -v android debug

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: nomal-apk
          path: bin/*.apk

      - name: Protokoll bei Fehlschlag ausgeben
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bau-protokoll
          path: |
            .buildozer/android/platform/build-*/build.log
            .buildozer/**/*.log
          if-no-files-found: ignore
