name: APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: nomal für Android
    runs-on: ubuntu-22.04
    steps:
      - name: Projekt holen
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: System-Abhängigkeiten und Android-Tools installieren
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 python3-dev python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            ant openjdk-17-jdk zip unzip libltdl-dev

      - name: Cython und Buildozer installieren
        run: |
          pip3 install --upgrade pip
          pip3 install --user --upgrade setuptools wheel
          pip3 install --user --upgrade cython==0.29.36
          pip3 install --user --upgrade buildozer

      - name: Pfad für Buildozer exportieren
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Android SDK Lizenzen erzwingen
        run: |
          # Wir erstellen den erwarteten SDK-Pfad und die Lizenzdatei vorab im Home-Verzeichnis von Buildozer
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n24333f8a43b680ff223fcff1ae29f0ba22d05d56" >> /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: Spiel mit Buildozer kompilieren
        run: buildozer -v android debug

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: nomal-apk
          path: bin/*.apk

      - name: Protokoll bei Fehlschlag ausgeben
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bau-protokoll
          path: |
            .buildozer/android/platform/build-*/build.log
            .buildozer/**/*.log
          if-no-files-found: ignore
